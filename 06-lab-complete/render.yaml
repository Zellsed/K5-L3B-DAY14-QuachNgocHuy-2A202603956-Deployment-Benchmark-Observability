# ============================================================
# Render Blueprint — agent (Docker) + Redis (Key Value)
# Render Dashboard → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false                  # secret: nhập tay trên Dashboard, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ các service trong cùng tài khoản Render truy cập được
